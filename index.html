<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Radar Approche — Temps Réel</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" type="image/svg+xml" href="/icon.svg" />
  <meta name="theme-color" content="#070b14" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-dark: #070b14;
      --panel-bg: rgba(9, 14, 26, 0.78);
      --panel-border: rgba(148, 163, 184, 0.22);
      --accent: #38bdf8;
      --gold: #f59e0b;
      --live: #10b981;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
    }

    .backdrop-layer {
      position: fixed;
      inset: 0;
      z-index: 0;
      background-size: cover;
      background-repeat: no-repeat;
      background-position: 62% 40%;
      transition: opacity 0.45s ease-in-out;
      filter: brightness(0.90) contrast(1.04) saturate(1.06);
      opacity: 0;
    }
    .backdrop-layer.visible { opacity: 1; }

    .backdrop-reflection-layer {
      display: none;
    }

    .backdrop-overlay {
      position: fixed;
      inset: 0;
      z-index: 1;
      background:
        radial-gradient(circle at 20% 85%, rgba(7, 11, 20, 0.92) 0%, rgba(7, 11, 20, 0.52) 45%, rgba(7, 11, 20, 0.10) 85%),
        linear-gradient(to top, rgba(7, 11, 20, 0.85) 0%, rgba(7, 11, 20, 0.05) 55%);
    }

    .main-stage {
      position: relative;
      z-index: 2;
      height: 100vh;
      height: 100dvh;
      padding:
        calc(5.2rem + env(safe-area-inset-top))
        calc(2.2rem + env(safe-area-inset-right))
        calc(2rem + env(safe-area-inset-bottom))
        calc(2.2rem + env(safe-area-inset-left));
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
    }

    /* --- BARRE SUPÉRIEURE FIXE & ÉLÉMENTS GLISSANTS --- */
    .top-bar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 25;
      padding:
        calc(1.3rem + env(safe-area-inset-top))
        calc(2.2rem + env(safe-area-inset-right))
        0.8rem
        calc(2.2rem + env(safe-area-inset-left));
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.75rem;
      pointer-events: none;
    }

    .top-bar > * {
      pointer-events: auto;
    }

    .fadeable-ui {
      transition: opacity 0.45s ease, transform 0.45s ease;
    }

    body.idle-mode .fadeable-ui {
      opacity: 0;
      transform: translateY(-10px);
      pointer-events: none;
    }

    body.idle-mode {
      cursor: none;
    }

    .top-left {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      flex-wrap: wrap;
    }

    .top-right {
      display: flex;
      align-items: center;
      gap: 0.55rem;
    }

    /* --- MENU DÉROULANT AÉROPORT SUR MESURE --- */
    .airport-dropdown {
      position: relative;
      z-index: 30;
    }

    .airport-trigger {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      background: rgba(11, 18, 34, 0.86);
      border: 1px solid rgba(56, 189, 248, 0.45);
      backdrop-filter: blur(16px);
      color: var(--text-main);
      padding: 0.36rem 0.85rem 0.36rem 0.45rem;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.08);
    }

    .airport-trigger:hover,
    .airport-dropdown.open .airport-trigger {
      border-color: var(--accent);
      background: rgba(15, 23, 42, 0.95);
      box-shadow: 0 0 22px rgba(56, 189, 248, 0.28), inset 0 1px 0 rgba(255, 255, 255, 0.12);
    }

    .trigger-iata {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.74rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      color: #070b14;
      background: linear-gradient(135deg, #38bdf8, #7dd3fc);
      padding: 0.2rem 0.55rem;
      border-radius: 999px;
    }

    .trigger-name {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 0.82rem;
      font-weight: 600;
      color: #f8fafc;
    }

    .trigger-chevron {
      width: 15px;
      height: 15px;
      color: var(--accent);
      transition: transform 0.22s ease;
    }

    .airport-dropdown.open .trigger-chevron {
      transform: rotate(180deg);
    }

    .airport-menu {
      position: absolute;
      top: calc(100% + 0.55rem);
      left: 0;
      min-width: 305px;
      background: rgba(9, 14, 26, 0.94);
      border: 1px solid rgba(56, 189, 248, 0.35);
      backdrop-filter: blur(20px);
      border-radius: 16px;
      padding: 0.45rem;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.65), 0 0 0 1px rgba(255, 255, 255, 0.04) inset;
      opacity: 0;
      visibility: hidden;
      transform: translateY(-8px) scale(0.98);
      transform-origin: top left;
      transition: opacity 0.18s ease, transform 0.18s ease, visibility 0.18s;
    }

    .airport-dropdown.open .airport-menu {
      opacity: 1;
      visibility: visible;
      transform: translateY(0) scale(1);
    }

    .menu-header {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.64rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      padding: 0.35rem 0.65rem 0.45rem;
      border-bottom: 1px solid rgba(148, 163, 184, 0.12);
      margin-bottom: 0.3rem;
    }

    .airport-option {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      background: transparent;
      border: 1px solid transparent;
      border-radius: 10px;
      padding: 0.55rem 0.65rem;
      color: var(--text-main);
      cursor: pointer;
      text-align: left;
      transition: all 0.15s ease;
    }

    .airport-option:hover {
      background: rgba(56, 189, 248, 0.12);
      border-color: rgba(56, 189, 248, 0.25);
    }

    .airport-option.active {
      background: rgba(56, 189, 248, 0.18);
      border-color: rgba(56, 189, 248, 0.45);
    }

    .opt-left {
      display: flex;
      align-items: center;
      gap: 0.65rem;
    }

    .opt-iata {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.74rem;
      font-weight: 700;
      color: var(--accent);
      background: rgba(56, 189, 248, 0.14);
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 0.22rem 0.48rem;
      border-radius: 6px;
      min-width: 44px;
      text-align: center;
    }

    .airport-option.active .opt-iata {
      background: var(--accent);
      color: #070b14;
      border-color: var(--accent);
    }

    .opt-info {
      display: flex;
      flex-direction: column;
    }

    .opt-city {
      font-size: 0.84rem;
      font-weight: 600;
      color: #f8fafc;
    }

    .opt-sub {
      font-size: 0.68rem;
      color: var(--text-muted);
    }

    .opt-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: transparent;
      flex-shrink: 0;
    }

    .airport-option.active .opt-dot {
      background: var(--live);
      box-shadow: 0 0 8px var(--live);
    }

    .airport-tag {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      backdrop-filter: blur(12px);
      padding: 0.42rem 0.9rem;
      border-radius: 999px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.78rem;
      color: #e2e8f0;
    }

    .live-clock {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.82rem;
      font-weight: 700;
      color: #34d399;
      background: rgba(16, 185, 129, 0.18);
      border: 1px solid rgba(16, 185, 129, 0.45);
      backdrop-filter: blur(12px);
      padding: 0.4rem 0.85rem;
      border-radius: 999px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
      will-change: transform;
      z-index: 28;
    }

    body.idle-mode .live-clock {
      position: fixed;
      top: calc(1.3rem + env(safe-area-inset-top));
      left: calc(2.2rem + env(safe-area-inset-left));
    }

    .alert-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-muted);
      background: rgba(11, 18, 34, 0.86);
      border: 1px solid rgba(148, 163, 184, 0.28);
      backdrop-filter: blur(14px);
      padding: 0.42rem 0.78rem;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .alert-pill:hover {
      border-color: rgba(251, 191, 36, 0.55);
      color: #fde68a;
    }

    .alert-pill.active {
      color: #fde68a;
      background: rgba(245, 158, 11, 0.22);
      border-color: rgba(251, 191, 36, 0.65);
      box-shadow: 0 0 16px rgba(245, 158, 11, 0.22);
    }

    .traffic-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.78rem;
      font-weight: 600;
      color: #e2e8f0;
      background: rgba(11, 18, 34, 0.86);
      border: 1px solid rgba(56, 189, 248, 0.35);
      backdrop-filter: blur(14px);
      padding: 0.42rem 0.92rem;
      border-radius: 999px;
      cursor: pointer;
      will-change: transform;
      z-index: 28;
      transition: border-color 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
    }

    .traffic-pill:hover {
      border-color: var(--accent);
      background: rgba(15, 23, 42, 0.96);
      box-shadow: 0 0 18px rgba(56, 189, 248, 0.22);
    }

    .traffic-pill svg {
      width: 14px;
      height: 14px;
      color: var(--accent);
    }

    .lock-pill {
      display: none;
      align-items: center;
      gap: 0.45rem;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.74rem;
      font-weight: 700;
      color: #fde68a;
      background: rgba(245, 158, 11, 0.22);
      border: 1px solid rgba(251, 191, 36, 0.65);
      backdrop-filter: blur(12px);
      padding: 0.4rem 0.85rem;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .lock-pill.visible {
      display: inline-flex;
    }

    .lock-pill:hover {
      background: rgba(245, 158, 11, 0.35);
    }

    .pulse-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--live);
      box-shadow: 0 0 10px var(--live);
      animation: pulse 1.2s infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.45); opacity: 0.45; }
    }

    /* --- VOLET LATÉRAL TOUR DE CONTRÔLE (DRAWER) --- */
    .atc-backdrop {
      position: fixed;
      inset: 0;
      z-index: 40;
      background: rgba(3, 6, 14, 0.55);
      backdrop-filter: blur(3px);
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.25s ease, visibility 0.25s ease;
    }

    .atc-backdrop.open {
      opacity: 1;
      visibility: visible;
    }

    .atc-drawer {
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      z-index: 50;
      width: 390px;
      max-width: 92vw;
      background: rgba(8, 13, 24, 0.94);
      border-left: 1px solid rgba(56, 189, 248, 0.28);
      backdrop-filter: blur(24px);
      box-shadow: -20px 0 50px rgba(0, 0, 0, 0.7);
      display: flex;
      flex-direction: column;
      transform: translateX(102%);
      transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1);
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }

    .atc-drawer.open {
      transform: translateX(0);
    }

    .atc-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.2rem 1.35rem 1rem;
      border-bottom: 1px solid rgba(148, 163, 184, 0.14);
    }

    .atc-title-group {
      display: flex;
      flex-direction: column;
      gap: 0.18rem;
    }

    .atc-kicker {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.64rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--accent);
    }

    .atc-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.12rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .atc-close {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: rgba(148, 163, 184, 0.12);
      border: 1px solid rgba(148, 163, 184, 0.22);
      color: var(--text-main);
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.18s ease;
    }

    .atc-close:hover {
      background: rgba(56, 189, 248, 0.2);
      border-color: var(--accent);
    }

    .atc-list {
      flex: 1;
      overflow-y: auto;
      padding: 0.85rem 1.15rem 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
    }

    .atc-card {
      width: 100%;
      background: rgba(15, 23, 42, 0.72);
      border: 1px solid rgba(148, 163, 184, 0.16);
      border-radius: 12px;
      padding: 0.75rem 0.9rem;
      text-align: left;
      color: var(--text-main);
      cursor: pointer;
      transition: all 0.18s ease;
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    .atc-card:hover {
      background: rgba(56, 189, 248, 0.12);
      border-color: rgba(56, 189, 248, 0.42);
      transform: translateX(-2px);
    }

    .atc-card.selected {
      background: rgba(56, 189, 248, 0.18);
      border-color: var(--accent);
      box-shadow: 0 0 18px rgba(56, 189, 248, 0.16);
    }

    .atc-card.is-rare {
      border-color: rgba(251, 191, 36, 0.45);
      background: linear-gradient(135deg, rgba(245, 158, 11, 0.12), rgba(15, 23, 42, 0.82));
    }

    .atc-card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
    }

    .atc-callsign {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--accent);
    }

    .atc-card.is-rare .atc-callsign {
      color: #fde68a;
    }

    .atc-dist {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.76rem;
      font-weight: 700;
      color: #e2e8f0;
      background: rgba(7, 11, 20, 0.75);
      padding: 0.16rem 0.5rem;
      border-radius: 6px;
      border: 1px solid rgba(148, 163, 184, 0.2);
      flex-shrink: 0;
    }

    .atc-model {
      font-size: 0.86rem;
      font-weight: 600;
      color: #f8fafc;
    }

    .atc-sub {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.7rem;
      color: var(--text-muted);
    }

    .atc-rare-tag {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.64rem;
      font-weight: 700;
      color: #fde68a;
    }

    /* --- ZONE INFÉRIEURE --- */
    .bottom-dock {
      display: flex;
      align-items: flex-end;
      width: 100%;
    }

    .bottom-left-hud {
      max-width: 720px;
      width: 100%;
    }

    .rare-banner {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      background: linear-gradient(90deg, rgba(245, 158, 11, 0.28), rgba(217, 119, 6, 0.16));
      border: 1px solid rgba(251, 191, 36, 0.7);
      color: #fde68a;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.76rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      padding: 0.3rem 0.75rem;
      border-radius: 8px;
      margin-bottom: 0.45rem;
      box-shadow: 0 0 18px rgba(245, 158, 11, 0.25);
    }

    .rare-banner:empty {
      display: none;
    }

    .bottom-left-hud.is-rare .metric-card.is-live {
      border-color: rgba(251, 191, 36, 0.5);
      box-shadow: 0 0 16px rgba(245, 158, 11, 0.14);
    }

    .airline-badge {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.55rem;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 0.25rem;
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.8);
    }

    .callsign-pill {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.84rem;
      background: rgba(56, 189, 248, 0.22);
      border: 1px solid rgba(56, 189, 248, 0.45);
      color: #e0f2fe;
      padding: 0.16rem 0.58rem;
      border-radius: 6px;
    }

    .phase-pill {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.74rem;
      font-weight: 700;
      background: rgba(16, 185, 129, 0.22);
      border: 1px solid rgba(16, 185, 129, 0.45);
      color: #6ee7b7;
      padding: 0.16rem 0.55rem;
      border-radius: 6px;
    }

    .aircraft-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(2rem, 3.6vw, 3.1rem);
      font-weight: 700;
      line-height: 1.06;
      letter-spacing: -0.02em;
      margin-bottom: 0.65rem;
      text-shadow: 0 4px 20px rgba(0, 0, 0, 0.85);
    }

    /* --- FRISE DE TRAJET RESPONSIVE & ADAPTATIVE --- */
    .route-banner {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      max-width: 560px;
      width: 100%;
      background: rgba(11, 18, 34, 0.88);
      border: 1px solid rgba(56, 189, 248, 0.32);
      backdrop-filter: blur(14px);
      padding: 0.48rem 0.85rem;
      border-radius: 11px;
      margin-bottom: 0.7rem;
      font-family: 'JetBrains Mono', monospace;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.35);
    }

    .route-banner:empty {
      display: none;
    }

    .route-airport {
      display: flex;
      flex-direction: column;
      flex: 0 1 auto;
      min-width: 42px;
      max-width: 34%;
    }

    .route-airport.dest {
      text-align: right;
      align-items: flex-end;
    }

    .route-tag {
      font-size: 0.54rem;
      text-transform: uppercase;
      color: var(--text-muted);
      letter-spacing: 0.08em;
      margin-bottom: 0.08rem;
    }

    .route-name {
      font-size: 0.82rem;
      font-weight: 700;
      color: #f8fafc;
      line-height: 1.18;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      word-break: break-word;
    }

    .route-name.is-long {
      font-size: 0.71rem;
    }

    .route-track-wrap {
      flex: 1 1 auto;
      min-width: 82px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.3rem;
    }

    .route-track-meta {
      font-size: 0.6rem;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: 0.03em;
      white-space: nowrap;
      transition: opacity 0.28s ease;
    }

    .route-track-meta.is-eta {
      color: #6ee7b7;
    }

    .route-track-meta.switching {
      opacity: 0;
    }

    .route-track {
      position: relative;
      width: 100%;
      height: 2.5px;
      background: rgba(148, 163, 184, 0.24);
      border-radius: 999px;
      display: flex;
      align-items: center;
    }

    .route-track::before,
    .route-track::after {
      content: "";
      position: absolute;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--accent);
    }

    .route-track::before { left: 0; }
    .route-track::after { right: 0; background: rgba(148, 163, 184, 0.6); }

    .route-track-fill {
      height: 100%;
      background: linear-gradient(90deg, rgba(56, 189, 248, 0.45), #38bdf8);
      border-radius: 999px;
      transition: width 0.6s ease;
    }

    .route-plane-icon {
      position: absolute;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 19px;
      height: 19px;
      border-radius: 50%;
      background: #070b14;
      border: 1.5px solid var(--accent);
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.55);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #f8fafc;
      font-size: 0.64rem;
      transition: left 0.6s ease;
    }

    .aircraft-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem;
      margin-bottom: 0.8rem;
    }

    .meta-chip {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.74rem;
      background: rgba(9, 14, 26, 0.84);
      border: 1px solid var(--panel-border);
      backdrop-filter: blur(10px);
      padding: 0.28rem 0.65rem;
      border-radius: 7px;
      color: #e2e8f0;
    }

    /* --- SÉPARATEUR SUBTIL : DONNÉES LIVE VS FICHE CONSTRUCTEUR --- */
    .telemetry-wrapper {
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
      max-width: 720px;
      margin-bottom: 0.45rem;
    }

    .live-cards-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.6rem;
    }

    .metric-card {
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      backdrop-filter: blur(14px);
      border-radius: 12px;
      padding: 0.68rem 0.85rem;
      transition: border-color 0.3s ease, box-shadow 0.3s ease;
    }

    .metric-card.is-live {
      background: rgba(11, 18, 34, 0.86);
      border-color: rgba(56, 189, 248, 0.34);
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.28), inset 0 1px 0 rgba(56, 189, 248, 0.12);
    }

    .metric-card.is-live .metric-label {
      color: #bae6fd;
    }

    .specs-divider {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      margin: 0.1rem 0 -0.05rem;
    }

    .specs-divider:empty {
      display: none;
    }

    .specs-divider-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.6rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: rgba(148, 163, 184, 0.72);
      white-space: nowrap;
    }

    .specs-divider-line {
      height: 1px;
      flex: 1;
      background: linear-gradient(90deg, rgba(148, 163, 184, 0.24), transparent);
    }

    .specs-cards-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.55rem;
    }

    .specs-cards-grid.cols-2 {
      grid-template-columns: repeat(2, 1fr);
      max-width: 355px;
    }

    .specs-cards-grid:empty {
      display: none;
    }

    .metric-card.is-spec {
      background: rgba(7, 11, 20, 0.66);
      border-color: rgba(148, 163, 184, 0.15);
      padding: 0.55rem 0.8rem;
    }

    .metric-card.is-spec .metric-value {
      font-size: 0.96rem;
      color: #cbd5e1;
    }

    .metric-label {
      font-size: 0.66rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      margin-bottom: 0.2rem;
    }

    .metric-value {
      font-family: 'JetBrains Mono', monospace;
      font-size: 1.06rem;
      font-weight: 700;
      color: var(--text-main);
      white-space: nowrap;
    }

    .metric-unit {
      font-size: 0.72rem;
      font-weight: 400;
      color: var(--text-muted);
      margin-left: 0.16rem;
    }

    .photo-credit {
      display: inline-block;
      font-size: 0.72rem;
      color: #cbd5e1;
      background: rgba(7, 11, 20, 0.75);
      padding: 0.26rem 0.72rem;
      border-radius: 999px;
      border: 1px solid rgba(148, 163, 184, 0.18);
      margin-top: 0.25rem;
    }
    .photo-credit:empty { display: none; }

    /* =====================================================================
       ADAPTATION MOBILE UNIQUEMENT (<= 768px) — NE TOUCHE PAS AU DESKTOP
       ===================================================================== */
    @media (max-width: 768px) {
      body {
        height: auto;
        min-height: 100dvh;
        overflow-y: auto;
        -webkit-tap-highlight-color: transparent;
      }

      /* 1. Photo nette centrée verticalement entre le header et le nom du modèle */
      .backdrop-layer {
        inset: auto;
        top: calc(4.9rem + env(safe-area-inset-top));
        left: 0;
        right: 0;
        height: 31dvh;
        z-index: 1;
        background-size: contain;
        background-position: center center;
        background-color: transparent;
        filter: brightness(0.98) contrast(1.04) saturate(1.06);
        mask-image: linear-gradient(to bottom, transparent 0%, black 7%, black 92%, transparent 100%);
        -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 7%, black 92%, transparent 100%);
      }

      /* 2. Reflet inversé (reverse) flouté vers le bas pour étendre l'ambiance jusqu'au pied de page */
      .backdrop-reflection-layer {
        display: block;
        position: fixed;
        top: calc(4.9rem + env(safe-area-inset-top) + 30dvh);
        left: -10%;
        right: -10%;
        height: 46dvh;
        z-index: 0;
        pointer-events: none;
        background-size: cover;
        background-position: center bottom;
        background-repeat: no-repeat;
        transform: scaleY(-1);
        filter: blur(28px) brightness(0.58) saturate(1.25);
        opacity: 0;
        transition: opacity 0.45s ease-in-out;
        mask-image: linear-gradient(to top, black 0%, rgba(0, 0, 0, 0.72) 45%, transparent 100%);
        -webkit-mask-image: linear-gradient(to top, black 0%, rgba(0, 0, 0, 0.72) 45%, transparent 100%);
      }

      .backdrop-reflection-layer.visible {
        opacity: 0.85;
      }

      /* Dégradé de fusion douce derrière le HUD */
      .backdrop-overlay {
        inset: 0;
        z-index: 1;
        pointer-events: none;
        background:
          linear-gradient(
            to bottom,
            rgba(7, 11, 20, 0.88) 0%,
            rgba(7, 11, 20, 0.0) 15%,
            rgba(7, 11, 20, 0.0) 44%,
            rgba(7, 11, 20, 0.68) 60%,
            rgba(7, 11, 20, 0.94) 84%,
            #070b14 100%
          );
      }

      .top-bar {
        padding:
          calc(0.65rem + env(safe-area-inset-top))
          calc(1rem + env(safe-area-inset-right))
          0.6rem
          calc(1rem + env(safe-area-inset-left));
        gap: 0.45rem;
        background: linear-gradient(to bottom, rgba(7, 11, 20, 0.78) 0%, rgba(7, 11, 20, 0) 100%);
        transition: background 0.4s ease;
      }

      body.idle-mode .top-bar {
        background: transparent;
      }

      /* En mode veille sur mobile : Horloge en haut à gauche, Tour de contrôle en haut à droite */
      body.idle-mode .live-clock {
        position: fixed;
        top: calc(0.65rem + env(safe-area-inset-top));
        left: calc(1rem + env(safe-area-inset-left));
      }

      body.idle-mode .traffic-pill {
        position: fixed;
        top: calc(0.65rem + env(safe-area-inset-top));
        right: calc(1rem + env(safe-area-inset-right));
      }

      .main-stage {
        height: auto;
        min-height: 100dvh;
        padding:
          calc(5.6rem + env(safe-area-inset-top))
          calc(1rem + env(safe-area-inset-right))
          calc(1.35rem + env(safe-area-inset-bottom))
          calc(1rem + env(safe-area-inset-left));
        gap: 1.5rem;
      }

      .top-left,
      .top-right {
        width: 100%;
        justify-content: space-between;
        gap: 0.45rem;
      }

      .airport-dropdown {
        flex: 1 1 auto;
      }

      .airport-trigger {
        width: 100%;
        justify-content: space-between;
        padding: 0.45rem 0.85rem 0.45rem 0.5rem;
      }

      .trigger-name {
        font-size: 0.86rem;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .airport-menu {
        width: calc(100vw - 2rem);
        min-width: unset;
        max-height: 65dvh;
        overflow-y: auto;
      }

      .airport-option {
        padding: 0.68rem 0.7rem;
      }

      .live-clock {
        font-size: 0.78rem;
        padding: 0.42rem 0.72rem;
      }

      .airport-tag,
      .traffic-pill,
      .lock-pill,
      .alert-pill {
        font-size: 0.72rem;
        padding: 0.36rem 0.7rem;
      }

      /* Positionne le bloc compagnie / modèle juste sous la photo centrée */
      .bottom-dock {
        margin-top: auto;
        padding-top: 31dvh;
      }

      .rare-banner {
        display: flex;
        font-size: 0.74rem;
        padding: 0.38rem 0.75rem;
        line-height: 1.35;
      }

      .airline-badge {
        font-size: 1rem;
        gap: 0.45rem;
      }

      .aircraft-title {
        font-size: clamp(1.75rem, 7.5vw, 2.35rem);
        margin-bottom: 0.6rem;
      }

      .route-banner {
        max-width: 100%;
        gap: 0.55rem;
        padding: 0.5rem 0.7rem;
      }

      .route-airport {
        max-width: 34%;
      }

      .route-name {
        font-size: 0.76rem;
      }

      .route-name.is-long {
        font-size: 0.66rem;
      }

      .route-track-wrap {
        min-width: 72px;
      }

      .meta-chip {
        font-size: 0.76rem;
        padding: 0.32rem 0.65rem;
      }

      .live-cards-grid,
      .specs-cards-grid,
      .specs-cards-grid.cols-2 {
        grid-template-columns: repeat(2, 1fr);
        max-width: 100%;
        gap: 0.55rem;
      }

      .metric-card {
        padding: 0.72rem 0.85rem;
      }

      .metric-label {
        font-size: 0.68rem;
      }

      .metric-value {
        font-size: 1.12rem;
      }
    }

    /* --- ÉCRAN DE DÉMARRAGE / RÉVEIL SERVEUR --- */
    .boot-screen {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background-color: var(--bg-dark);
      background-image: radial-gradient(circle at 50% 45%, rgba(56, 189, 248, 0.08) 0%, transparent 60%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.4rem;
      transition: opacity 0.45s ease, visibility 0.45s ease;
    }

    .boot-screen.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .boot-radar {
      position: relative;
      width: 76px;
      height: 76px;
      border-radius: 50%;
      border: 1.5px solid rgba(56, 189, 248, 0.35);
      box-shadow: 0 0 28px rgba(56, 189, 248, 0.15), inset 0 0 16px rgba(56, 189, 248, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .boot-radar::before {
      content: "";
      position: absolute;
      inset: 15px;
      border-radius: 50%;
      border: 1px dashed rgba(56, 189, 248, 0.3);
    }

    .boot-radar::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: conic-gradient(from 0deg, rgba(56, 189, 248, 0.42) 0deg, transparent 85deg);
      animation: radar-sweep 1.8s linear infinite;
    }

    .boot-center-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--live);
      box-shadow: 0 0 10px var(--live);
      z-index: 1;
    }

    .boot-text-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.35rem;
      text-align: center;
      padding: 0 1.5rem;
    }

    .boot-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: var(--text-main);
    }

    .boot-sub {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.74rem;
      color: var(--accent);
      opacity: 0.9;
    }

    @keyframes radar-sweep {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="boot-screen" id="boot-screen">
    <div class="boot-radar">
      <div class="boot-center-dot"></div>
    </div>
    <div class="boot-text-wrap">
      <div class="boot-title">INITIALISATION RADAR</div>
      <div class="boot-sub" id="boot-status">Connexion à la tour de contrôle...</div>
    </div>
  </div>

  <div class="backdrop-reflection-layer" id="bg-ref-a"></div>
  <div class="backdrop-reflection-layer" id="bg-ref-b"></div>
  <div class="backdrop-layer" id="bg-a"></div>
  <div class="backdrop-layer" id="bg-b"></div>
  <div class="backdrop-overlay"></div>

  <!-- VOLET LATÉRAL TOUR DE CONTRÔLE -->
  <div class="atc-backdrop" id="atc-backdrop"></div>
  <aside class="atc-drawer" id="atc-drawer" aria-label="Trafic aérien de la zone">
    <div class="atc-header">
      <div class="atc-title-group">
        <span class="atc-kicker">TOUR DE CONTRÔLE • SECTEUR</span>
        <h2 class="atc-title" id="atc-drawer-title">Trafic en zone</h2>
      </div>
      <button type="button" class="atc-close" id="atc-close" aria-label="Fermer">✕</button>
    </div>
    <div class="atc-list" id="atc-list"></div>
  </aside>

  <header class="top-bar">
    <div class="top-left">
      <div class="airport-dropdown fadeable-ui" id="airport-dropdown">
        <button type="button" class="airport-trigger" id="airport-trigger" aria-expanded="false">
          <span class="trigger-iata" id="trigger-iata">TLS</span>
          <span class="trigger-name" id="trigger-name">Toulouse-Blagnac</span>
          <svg class="trigger-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="6 9 12 15 18 9"></polyline>
          </svg>
        </button>

        <div class="airport-menu" id="airport-menu" role="listbox">
          <div class="menu-header">Sélectionner une zone radar</div>
          <button type="button" class="airport-option active" data-id="TLS" data-city="Toulouse-Blagnac">
            <div class="opt-left">
              <span class="opt-iata">TLS</span>
              <div class="opt-info">
                <span class="opt-city">Toulouse-Blagnac</span>
                <span class="opt-sub">France • Pistes 14/32 & Usines Airbus</span>
              </div>
            </div>
            <span class="opt-dot"></span>
          </button>

          <button type="button" class="airport-option" data-id="DXB" data-city="Dubaï International">
            <div class="opt-left">
              <span class="opt-iata">DXB</span>
              <div class="opt-info">
                <span class="opt-city">Dubaï International</span>
                <span class="opt-sub">Émirats • Approche Terre 30L/30R</span>
              </div>
            </div>
            <span class="opt-dot"></span>
          </button>

          <button type="button" class="airport-option" data-id="CDG" data-city="Paris-Charles de Gaulle">
            <div class="opt-left">
              <span class="opt-iata">CDG</span>
              <div class="opt-info">
                <span class="opt-city">Paris-Charles de Gaulle</span>
                <span class="opt-sub">France • Hub International Roissy</span>
              </div>
            </div>
            <span class="opt-dot"></span>
          </button>

          <button type="button" class="airport-option" data-id="LHR" data-city="Londres-Heathrow">
            <div class="opt-left">
              <span class="opt-iata">LHR</span>
              <div class="opt-info">
                <span class="opt-city">Londres-Heathrow</span>
                <span class="opt-sub">Royaume-Uni • Pistes 09/27</span>
              </div>
            </div>
            <span class="opt-dot"></span>
          </button>

          <button type="button" class="airport-option" data-id="JFK" data-city="New York-JFK">
            <div class="opt-left">
              <span class="opt-iata">JFK</span>
              <div class="opt-info">
                <span class="opt-city">New York-JFK</span>
                <span class="opt-sub">États-Unis • Queens, NY</span>
              </div>
            </div>
            <span class="opt-dot"></span>
          </button>

          <button type="button" class="airport-option" data-id="SIN" data-city="Singapour-Changi">
            <div class="opt-left">
              <span class="opt-iata">SIN</span>
              <div class="opt-info">
                <span class="opt-city">Singapour-Changi</span>
                <span class="opt-sub">Singapour • Hub Asie-Pacifique</span>
              </div>
            </div>
            <span class="opt-dot"></span>
          </button>
        </div>
      </div>

      <div class="airport-tag fadeable-ui">
        <span class="pulse-dot"></span>
        <span id="status-label">SCAN EN COURS...</span>
      </div>
      <div class="live-clock" id="live-clock">--:--:--</div>
    </div>

    <div class="top-right">
      <button type="button" class="alert-pill fadeable-ui" id="alert-btn" title="Recevoir une notification lors du passage d'un appareil rare">
        <span id="alert-icon">🔕</span>
        <span id="alert-label">Alertes Rares</span>
      </button>
      <button type="button" class="lock-pill fadeable-ui" id="unlock-btn" title="Revenir automatiquement sur l'avion le plus proche">
        <span>🔒 SUIVI VERROUILLÉ • Direct</span>
      </button>
      <button type="button" class="traffic-pill" id="traffic-btn" title="Ouvrir la liste des avions en zone">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="8" y1="6" x2="21" y2="6"></line>
          <line x1="8" y1="12" x2="21" y2="12"></line>
          <line x1="8" y1="18" x2="21" y2="18"></line>
          <line x1="3" y1="6" x2="3.01" y2="6"></line>
          <line x1="3" y1="12" x2="3.01" y2="12"></line>
          <line x1="3" y1="18" x2="3.01" y2="18"></line>
        </svg>
        <span id="traffic-count">0 avion en zone</span>
      </button>
    </div>
  </header>

  <main class="main-stage">
    <div class="bottom-dock">
      <section class="bottom-left-hud" id="hud-container">
        <div class="rare-banner" id="rare-banner"></div>

        <div class="airline-badge">
          <span id="airline-name">RECHERCHE RADAR...</span>
          <span class="callsign-pill" id="callsign">---</span>
          <span class="phase-pill" id="flight-phase">SCAN</span>
        </div>

        <h1 class="aircraft-title" id="aircraft-model">En attente d'un appareil</h1>

        <div class="route-banner" id="route-banner"></div>

        <div class="aircraft-meta" id="specs-chips">
          <span class="meta-chip">OACI : —</span>
          <span class="meta-chip">IMMAT : —</span>
        </div>

        <div class="telemetry-wrapper">
          <div class="live-cards-grid" id="live-cards-grid">
            <div class="metric-card is-live">
              <div class="metric-label">Distance axe</div>
              <div class="metric-value">—<span class="metric-unit">km</span></div>
            </div>
            <div class="metric-card is-live">
              <div class="metric-label">Altitude</div>
              <div class="metric-value">—<span class="metric-unit">ft</span></div>
            </div>
            <div class="metric-card is-live">
              <div class="metric-label">Vitesse sol</div>
              <div class="metric-value">—<span class="metric-unit">kts</span></div>
            </div>
            <div class="metric-card is-live">
              <div class="metric-label">Cap / Vario</div>
              <div class="metric-value">—<span class="metric-unit">°</span></div>
            </div>
          </div>

          <div class="specs-divider" id="specs-divider"></div>
          <div class="specs-cards-grid" id="specs-cards-grid"></div>
        </div>

        <div class="photo-credit" id="photo-credit"></div>
      </section>
    </div>
  </main>

  <script>
    // --- ENREGISTREMENT SERVICE WORKER (DÉMARRAGE INSTANTANÉ & NOTIFICATIONS) ---
    let swRegistration = null;
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("/sw.js")
          .then((reg) => { swRegistration = reg; })
          .catch(() => {});
      });

      navigator.serviceWorker.addEventListener("message", (event) => {
        if (event.data?.type === "VERROUILLER_AVION_RARE" && event.data.hex) {
          hexVerrouille = event.data.hex;
          derniereSignature = "";
          unlockBtn.classList.add("visible");
          actualiser();
        }
      });
    }

    // --- GESTION DES PARAMÈTRES URL (RACCOURCIS D'ICÔNE & NOTIFICATIONS) ---
    const urlParams = new URLSearchParams(window.location.search);
    const paramZoneUrl = urlParams.get("zone");
    const paramHexUrl = urlParams.get("hex");

    let derniereUrlPhoto = "";
    let coucheActive = "a";
    let derniereSignature = "";
    let zoneCourante = paramZoneUrl || localStorage.getItem("radar_zone_id") || "TLS";
    let hexVerrouille = paramHexUrl || "";
    let timerInactivite = null;
    let afficherEtaCycle = false;

    if (paramZoneUrl) {
      localStorage.setItem("radar_zone_id", paramZoneUrl);
      fetch(`/api/zone?id=${encodeURIComponent(paramZoneUrl)}`).catch(() => {});
    }

    // --- SYSTÈME DE NOTIFICATIONS PUSH LOCALES "AVIONS RARES" ---
    const alertBtn = document.getElementById("alert-btn");
    const alertIcon = document.getElementById("alert-icon");
    const alertLabel = document.getElementById("alert-label");
    let alertesActives = localStorage.getItem("radar_alertes_rares") === "1" && ("Notification" in window) && Notification.permission === "granted";
    const raresDejaNotifies = new Set(JSON.parse(sessionStorage.getItem("rares_notifies") || "[]"));

    function majBoutonAlertes() {
      alertBtn.classList.toggle("active", alertesActives);
      alertIcon.textContent = alertesActives ? "🔔" : "🔕";
      alertLabel.textContent = alertesActives ? "Alertes ON" : "Alertes Rares";
    }
    majBoutonAlertes();

    alertBtn.addEventListener("click", async () => {
      if (!("Notification" in window)) {
        alert("Les notifications ne sont pas supportées par ce navigateur.");
        return;
      }

      if (alertesActives) {
        alertesActives = false;
        localStorage.setItem("radar_alertes_rares", "0");
        majBoutonAlertes();
        return;
      }

      const perm = await Notification.requestPermission();
      if (perm === "granted") {
        alertesActives = true;
        localStorage.setItem("radar_alertes_rares", "1");
        majBoutonAlertes();
        envoyerNotificationRare(
          "Radar Approche • Alertes activées",
          `Vous serez averti dès qu'un appareil rare (Beluga, A380, prototype...) entre dans le secteur ${zoneCourante}.`,
          "",
          zoneCourante
        );
      } else {
        alert("Autorise les notifications dans les réglages de ton navigateur pour recevoir les alertes.");
      }
    });

    function envoyerNotificationRare(titre, corps, hex, zone) {
      if (!alertesActives || Notification.permission !== "granted") return;

      const optionsNotif = {
        body: corps,
        icon: "/icon.svg",
        badge: "/icon.svg",
        tag: hex ? `rare-${hex}` : "radar-test",
        vibrate: [200, 100, 200],
        data: { hex, zone }
      };

      if (swRegistration && swRegistration.showNotification) {
        swRegistration.showNotification(titre, optionsNotif);
      } else {
        new Notification(titre, optionsNotif);
      }
    }

    function verifierAvionsRaresEnZone(listeAvions, zoneId) {
      if (!alertesActives || !Array.isArray(listeAvions)) return;

      for (const item of listeAvions) {
        const av = item.vol;
        if (!av || !av.badge_rare || !av.hex) continue;

        const cleUniq = `${zoneId}_${av.hex}`;
        if (raresDejaNotifies.has(cleUniq)) continue;

        raresDejaNotifies.add(cleUniq);
        sessionStorage.setItem("rares_notifies", JSON.stringify([...raresDejaNotifies]));

        const sp = item.specs || {};
        const modele = `${sp.manufacturer || ""} ${sp.model || av.icao}`.trim();
        const titre = `⭐ ${av.badge_rare} (${zoneId})`;
        const corps = `${modele} • ${av.indicatif}${av.compagnie ? " (" + av.compagnie + ")" : ""} à ${Number(av.distance_km).toFixed(1)} km`;

        envoyerNotificationRare(titre, corps, av.hex, zoneId);
      }
    }

    setInterval(() => {
      document.getElementById("live-clock").textContent = new Date().toLocaleTimeString("fr-FR");
    }, 1000);

    // --- ALTERNANCE PROGRESSION / ETA TOUTES LES 4 SECONDES ---
    function appliquerCycleTrajet() {
      const metaEl = document.getElementById("route-track-meta");
      if (!metaEl) return;
      const txtProg = metaEl.dataset.prog || "";
      const txtEta = metaEl.dataset.eta || "";
      if (!txtProg || !txtEta) return;

      metaEl.classList.add("switching");
      setTimeout(() => {
        metaEl.textContent = afficherEtaCycle ? txtEta : txtProg;
        metaEl.classList.toggle("is-eta", afficherEtaCycle);
        metaEl.classList.remove("switching");
      }, 240);
    }

    setInterval(() => {
      afficherEtaCycle = !afficherEtaCycle;
      appliquerCycleTrajet();
    }, 4000);

    // --- VOLET LATÉRAL TOUR DE CONTRÔLE ---
    const atcDrawer = document.getElementById("atc-drawer");
    const atcBackdrop = document.getElementById("atc-backdrop");
    const trafficBtn = document.getElementById("traffic-btn");
    const atcClose = document.getElementById("atc-close");
    const unlockBtn = document.getElementById("unlock-btn");

    if (hexVerrouille) {
      unlockBtn.classList.add("visible");
    }

    function ouvrirDrawerATC() {
      atcDrawer.classList.add("open");
      atcBackdrop.classList.add("open");
      reinitialiserInactivite();
    }

    function fermerDrawerATC() {
      atcDrawer.classList.remove("open");
      atcBackdrop.classList.remove("open");
    }

    trafficBtn.addEventListener("click", ouvrirDrawerATC);
    atcClose.addEventListener("click", fermerDrawerATC);
    atcBackdrop.addEventListener("click", fermerDrawerATC);

    unlockBtn.addEventListener("click", () => {
      hexVerrouille = "";
      derniereSignature = "";
      unlockBtn.classList.remove("visible");
      actualiser();
    });

    // --- MODE ÉCRAN DE VEILLE AVEC ANIMATION FLIP (HORLOGE + TOUR DE CONTRÔLE MOBILE) ---
    const dropdown = document.getElementById("airport-dropdown");
    const trigger = document.getElementById("airport-trigger");
    const options = document.querySelectorAll(".airport-option");
    const liveClock = document.getElementById("live-clock");

    function animerFlipElement(el, avant) {
      const apres = el.getBoundingClientRect();
      const dx = avant.left - apres.left;
      const dy = avant.top - apres.top;

      if (Math.abs(dx) > 1 || Math.abs(dy) > 1) {
        el.style.transition = "none";
        el.style.transform = `translate(${dx}px, ${dy}px)`;
        el.offsetHeight;
        el.style.transition = "transform 0.55s cubic-bezier(0.22, 1, 0.36, 1)";
        el.style.transform = "translate(0, 0)";
      }
    }

    function basculerModeVeille(actif) {
      const dejaActif = document.body.classList.contains("idle-mode");
      if (actif === dejaActif) return;

      const avantClock = liveClock.getBoundingClientRect();
      const avantTraffic = trafficBtn.getBoundingClientRect();

      document.body.classList.toggle("idle-mode", actif);

      animerFlipElement(liveClock, avantClock);
      animerFlipElement(trafficBtn, avantTraffic);
    }

    function reinitialiserInactivite() {
      basculerModeVeille(false);
      clearTimeout(timerInactivite);
      timerInactivite = setTimeout(() => {
        if (!dropdown.classList.contains("open") && !atcDrawer.classList.contains("open")) {
          basculerModeVeille(true);
        }
      }, 8000);
    }

    ["mousemove", "mousedown", "keydown", "touchstart"].forEach(evt => {
      document.addEventListener(evt, reinitialiserInactivite, { passive: true });
    });
    reinitialiserInactivite();

    // --- GESTION DU MENU DÉROULANT PERSONNALISÉ ---
    function synchroniserDropdown(id) {
      zoneCourante = id;
      options.forEach(opt => {
        const actif = opt.dataset.id === id;
        opt.classList.toggle("active", actif);
        if (actif) {
          document.getElementById("trigger-iata").textContent = id;
          document.getElementById("trigger-name").textContent = opt.dataset.city;
        }
      });
    }

    synchroniserDropdown(zoneCourante);

    trigger.addEventListener("click", (e) => {
      e.stopPropagation();
      const ouvert = dropdown.classList.toggle("open");
      trigger.setAttribute("aria-expanded", ouvert);
      reinitialiserInactivite();
    });

    document.addEventListener("click", (e) => {
      if (!dropdown.contains(e.target)) {
        dropdown.classList.remove("open");
        trigger.setAttribute("aria-expanded", "false");
      }
    });

    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") {
        dropdown.classList.remove("open");
        trigger.setAttribute("aria-expanded", "false");
        fermerDrawerATC();
      }
    });

    options.forEach(opt => {
      opt.addEventListener("click", async () => {
        const id = opt.dataset.id;
        dropdown.classList.remove("open");
        trigger.setAttribute("aria-expanded", "false");
        if (id === zoneCourante) return;

        localStorage.setItem("radar_zone_id", id);
        hexVerrouille = "";
        unlockBtn.classList.remove("visible");
        synchroniserDropdown(id);
        derniereSignature = "";
        document.getElementById("status-label").textContent = "CHANGEMENT DE ZONE...";
        try {
          await fetch(`/api/zone?id=${encodeURIComponent(id)}`);
          setTimeout(actualiser, 600);
        } catch (err) {}
      });
    });

    function formaterNombre(n) {
      if (n === null || n === undefined || n === "" || n === "N/A" || n === "0") return null;
      const num = Number(n);
      return Number.isNaN(num) ? String(n) : Math.round(num).toLocaleString("fr-FR");
    }

    function formaterHeureEta(ts) {
      if (!ts) return "";
      try {
        const d = new Date(Number(ts) * 1000);
        return d.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });
      } catch (e) {
        return "";
      }
    }

    function extraireSpec(s, keys) {
      for (const k of keys) {
        if (s[k] && s[k] !== "0" && s[k] !== "N/A") return s[k];
      }
      return null;
    }

    function afficherImageSurCalque(url) {
      const bgA = document.getElementById("bg-a");
      const bgB = document.getElementById("bg-b");
      const bgRefA = document.getElementById("bg-ref-a");
      const bgRefB = document.getElementById("bg-ref-b");

      if (coucheActive === "a") {
        bgB.style.backgroundImage = `url("${url}")`;
        bgB.classList.add("visible");
        bgA.classList.remove("visible");

        bgRefB.style.backgroundImage = `url("${url}")`;
        bgRefB.classList.add("visible");
        bgRefA.classList.remove("visible");

        coucheActive = "b";
      } else {
        bgA.style.backgroundImage = `url("${url}")`;
        bgA.classList.add("visible");
        bgB.classList.remove("visible");

        bgRefA.style.backgroundImage = `url("${url}")`;
        bgRefA.classList.add("visible");
        bgRefB.classList.remove("visible");

        coucheActive = "a";
      }
    }

    function changerPhoto(photoObj) {
      const urlHd = photoObj && photoObj.url ? photoObj.url : "";
      if (!urlHd || urlHd === derniereUrlPhoto) return;
      derniereUrlPhoto = urlHd;

      // Charger uniquement la version Haute Définition et l'afficher une fois prête
      const imgHd = new Image();
      imgHd.onload = () => {
        if (derniereUrlPhoto === urlHd) {
          afficherImageSurCalque(urlHd);
        }
      };
      imgHd.src = urlHd;
    }

    function construireGrillesSeparees(v, s) {
      const vs = Math.round(Number(v.taux_vertical || 0));
      const vsTxt = vs !== 0 ? ` (${vs > 0 ? "+" + vs : vs})` : "";

      const cartesLive = [
        { label: "Distance axe", html: `${Number(v.distance_km).toFixed(2)}<span class="metric-unit">km</span>` },
        { label: "Altitude", html: `${formaterNombre(v.altitude_ft) || "0"}<span class="metric-unit">ft</span>` },
        { label: "Vitesse sol", html: `${formaterNombre(v.vitesse_kts) || "0"}<span class="metric-unit">kts</span>` },
        { label: "Cap / Vario", html: `${Math.round(v.cap)}°<span class="metric-unit">${vsTxt}</span>` }
      ];

      document.getElementById("live-cards-grid").innerHTML = cartesLive.map(c => `
        <div class="metric-card is-live">
          <div class="metric-label">${c.label}</div>
          <div class="metric-value">${c.html}</div>
        </div>
      `).join("");

      const extras = [];

      const pax = formaterNombre(extraireSpec(s, ["max_passengers", "passengers", "pax"]));
      if (pax) extras.push({ label: "Capacité", html: `${pax}<span class="metric-unit">pax</span>` });

      const range = formaterNombre(extraireSpec(s, ["range_km", "range"]));
      if (range) extras.push({ label: "Autonomie", html: `${range}<span class="metric-unit">km</span>` });

      const env = formaterNombre(extraireSpec(s, ["wingspan_m", "wingspan"]));
      const lon = formaterNombre(extraireSpec(s, ["length_m", "length"]));
      if (env && lon) {
        extras.push({ label: "Envergure / Long.", html: `${env}<span class="metric-unit">m</span> × ${lon}<span class="metric-unit">m</span>` });
      } else if (env) {
        extras.push({ label: "Envergure", html: `${env}<span class="metric-unit">m</span>` });
      } else if (lon) {
        extras.push({ label: "Longueur", html: `${lon}<span class="metric-unit">m</span>` });
      }

      const cruise = formaterNombre(extraireSpec(s, ["cruise_speed_kmh", "cruise_speed_kts", "cruise_speed"]));
      if (cruise) {
        const unit = s.cruise_speed_kts ? "kts" : "km/h";
        extras.push({ label: "Croisière", html: `${cruise}<span class="metric-unit">${unit}</span>` });
      }

      const ceiling = formaterNombre(extraireSpec(s, ["ceiling_ft", "max_altitude_ft", "ceiling"]));
      if (ceiling) extras.push({ label: "Plafond max", html: `${ceiling}<span class="metric-unit">ft</span>` });

      if (v.squawk && v.squawk !== "0000") {
        extras.push({ label: "Squawk", html: `${v.squawk}` });
      }

      const nbExtrasRetenus = extras.length >= 4 ? 4 : (extras.length >= 2 ? 2 : 0);
      const specsRetenues = extras.slice(0, nbExtrasRetenus);

      const divider = document.getElementById("specs-divider");
      const specsGrid = document.getElementById("specs-cards-grid");

      if (specsRetenues.length > 0) {
        divider.innerHTML = `
          <span class="specs-divider-label">Spécifications appareil</span>
          <span class="specs-divider-line"></span>
        `;
        specsGrid.className = "specs-cards-grid" + (specsRetenues.length === 2 ? " cols-2" : "");
        specsGrid.innerHTML = specsRetenues.map(c => `
          <div class="metric-card is-spec">
            <div class="metric-label">${c.label}</div>
            <div class="metric-value">${c.html}</div>
          </div>
        `).join("");
      } else {
        divider.innerHTML = "";
        specsGrid.innerHTML = "";
      }
    }

    function afficherListeTourDeControle(listeAvions, hexActuel) {
      const container = document.getElementById("atc-list");
      const title = document.getElementById("atc-drawer-title");
      const nb = (listeAvions || []).length;
      title.textContent = `${nb} appareil${nb > 1 ? "s" : ""} dans le secteur`;

      if (!nb) {
        container.innerHTML = `<div style="color: var(--text-muted); font-size: 0.85rem; padding: 1rem 0;">Aucun appareil détecté dans cette zone pour le moment.</div>`;
        return;
      }

      container.innerHTML = listeAvions.map(item => {
        const av = item.vol;
        const sp = item.specs || {};
        const modele = `${sp.manufacturer || ""} ${sp.model || av.icao}`.trim();
        const trajet = (av.origine || av.destination)
          ? `${av.origine ? av.origine.code : "?"} → ${av.destination ? av.destination.code : "?"}`
          : av.phase;
        const actif = av.hex === hexActuel;

        return `
          <button type="button" class="atc-card ${actif ? "selected" : ""} ${av.badge_rare ? "is-rare" : ""}" data-hex="${av.hex}">
            <div class="atc-card-top">
              <span class="atc-callsign">${av.indicatif}${av.compagnie ? " • " + av.compagnie : ""}</span>
              <span class="atc-dist">${Number(av.distance_km).toFixed(1)} km</span>
            </div>
            <div class="atc-model">${modele}</div>
            <div class="atc-sub">
              <span>${trajet} • ${formaterNombre(av.altitude_ft) || 0} ft</span>
              <span>${formaterNombre(av.vitesse_kts) || 0} kts</span>
            </div>
            ${av.badge_rare ? `<div class="atc-rare-tag">⭐ ${av.badge_rare}</div>` : ""}
          </button>
        `;
      }).join("");

      container.querySelectorAll(".atc-card").forEach(btn => {
        btn.addEventListener("click", () => {
          hexVerrouille = btn.dataset.hex;
          derniereSignature = "";
          unlockBtn.classList.add("visible");
          fermerDrawerATC();
          actualiser();
        });
      });
    }

    function afficherDonnees(data) {
      if (data.zone_id && data.zone_id !== zoneCourante) {
        return;
      }

      verifierAvionsRaresEnZone(data.liste_avions, data.zone_id || zoneCourante);

      const nb = data.nb_avions || 0;
      document.getElementById("traffic-count").textContent = `${nb} avion${nb > 1 ? "s" : ""} en zone`;

      if (hexVerrouille && !data.verrouille && data.statut === "actif") {
        hexVerrouille = "";
        unlockBtn.classList.remove("visible");
      }

      const hexActuel = data.vol ? data.vol.hex : "";
      afficherListeTourDeControle(data.liste_avions, hexActuel);

      if (data.statut !== "actif" || !data.vol) {
        document.getElementById("status-label").textContent = `SCAN EN COURS • ${data.maj_serveur || ""}`;
        return;
      }

      const v = data.vol;
      const s = data.specs || {};
      const photo = data.photo;

      document.getElementById("status-label").textContent = `${data.source_api || "LIVE"} • ${data.maj_serveur || ""}`;
      construireGrillesSeparees(v, s);

      const origCode = v.origine ? v.origine.code : "";
      const destCode = v.destination ? v.destination.code : "";
      const pctVol = (v.progression && v.progression.pct !== null) ? v.progression.pct : "";
      const distRest = (v.progression && v.progression.dist_restante_km !== null) ? v.progression.dist_restante_km : "";
      const etaTxt = formaterHeureEta(v.eta_ts);
      const ageTxt = v.age || "";
      const sig = `${v.hex}_${v.icao}_${v.immat}_${origCode}_${destCode}_${pctVol}_${distRest}_${etaTxt}_${ageTxt}_${v.badge_rare || ""}`;

      if (sig !== derniereSignature) {
        derniereSignature = sig;

        const hud = document.getElementById("hud-container");
        const rareBanner = document.getElementById("rare-banner");
        if (v.badge_rare) {
          hud.classList.add("is-rare");
          rareBanner.textContent = `⭐ APPAREIL REMARQUABLE • ${v.badge_rare}`;
        } else {
          hud.classList.remove("is-rare");
          rareBanner.textContent = "";
        }

        document.getElementById("airline-name").textContent = v.compagnie || "Aviation Générale";
        document.getElementById("callsign").textContent = v.num_vol && v.num_vol !== v.indicatif
          ? `${v.indicatif} (${v.num_vol})`
          : v.indicatif;
        document.getElementById("flight-phase").textContent = v.phase;
        document.getElementById("aircraft-model").textContent = `${s.manufacturer || ""} ${s.model || v.icao}`.trim();

        const routeBanner = document.getElementById("route-banner");
        if (v.origine || v.destination) {
          const origNom = v.origine ? v.origine.nom : "Départ inconnu";
          const destNom = v.destination ? v.destination.nom : "Destination inconnue";
          const origLong = origNom.length > 14 ? "is-long" : "";
          const destLong = destNom.length > 14 ? "is-long" : "";
          const pct = (v.progression && v.progression.pct !== null)
            ? v.progression.pct
            : (v.phase === "EN APPROCHE" ? 86 : (v.phase === "MONTÉE" ? 14 : 50));

          const morceauxProg = [];
          if (v.progression && v.progression.pct !== null) morceauxProg.push(`${pct}%`);
          if (v.progression && v.progression.dist_restante_km !== null) morceauxProg.push(`${formaterNombre(v.progression.dist_restante_km)} km`);
          const txtProg = morceauxProg.length ? morceauxProg.join(" • ") : v.phase;
          const txtEta = etaTxt ? `ETA ${etaTxt}` : "";
          const texteInitial = (afficherEtaCycle && txtEta) ? txtEta : txtProg;
          const classeEtaInitiale = (afficherEtaCycle && txtEta) ? "is-eta" : "";

          routeBanner.innerHTML = `
            <div class="route-airport">
              <span class="route-tag">Départ</span>
              <span class="route-name ${origLong}">${origNom}</span>
            </div>
            <div class="route-track-wrap">
              <span class="route-track-meta ${classeEtaInitiale}" id="route-track-meta" data-prog="${txtProg}" data-eta="${txtEta}">${texteInitial}</span>
              <div class="route-track">
                <div class="route-track-fill" style="width: ${pct}%;"></div>
                <div class="route-plane-icon" style="left: ${pct}%;">✈</div>
              </div>
            </div>
            <div class="route-airport dest">
              <span class="route-tag">Arrivée</span>
              <span class="route-name ${destLong}">${destNom}</span>
            </div>
          `;
        } else {
          routeBanner.innerHTML = "";
        }

        const chips = [
          `<span class="meta-chip">OACI : ${v.icao}</span>`,
          `<span class="meta-chip">IMMAT : ${v.immat}</span>`
        ];
        if (ageTxt) {
          chips.push(`<span class="meta-chip">ÂGE : ${ageTxt}</span>`);
        }
        document.getElementById("specs-chips").innerHTML = chips.join("");
      }

      const credit = document.getElementById("photo-credit");
      if (photo && photo.url) {
        changerPhoto(photo);
        credit.textContent = `📷 ${photo.auteur}`;
      }
    }

    let premierChargementFait = false;
    const timerReveilRender = setTimeout(() => {
      const sub = document.getElementById("boot-status");
      if (sub && !premierChargementFait) {
        sub.textContent = "Réveil du serveur en cours (quelques secondes)...";
      }
    }, 3000);

    function masquerEcranDemarrage() {
      if (premierChargementFait) return;
      premierChargementFait = true;
      clearTimeout(timerReveilRender);
      const boot = document.getElementById("boot-screen");
      if (boot) boot.classList.add("hidden");
    }

    async function actualiser() {
      try {
        const paramHex = hexVerrouille ? `&hex=${encodeURIComponent(hexVerrouille)}` : "";
        const r = await fetch(`/api/trafic?zone=${encodeURIComponent(zoneCourante)}${paramHex}&t=${Date.now()}`, { cache: "no-store" });
        if (r.ok) {
          afficherDonnees(await r.json());
          masquerEcranDemarrage();
        }
      } catch (e) {}
    }

    actualiser();
    setInterval(actualiser, 5000);
  </script>
</body>
</html>
